server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/diarioweb_db
    username: postgres
    password: 12345
    driver-class-name: org.postgresql.Driver

  sql:
    init:
      mode: always
      platform: postgresql
      schema-locations: classpath:schema-postgresql.sql
      separator: ";"