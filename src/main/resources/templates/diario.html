<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Diário</title>
    
    <!--Fontes-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Parisienne&family=Poppins&family=Unna:wght@400;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" th:href="@{/css/styles-diario.css}">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="header-left">
            <h1>Dear Diary</h1>
            <p>Olá, Isabelle Fonseca!</p>
        </div>
        <div class="header-right">
            <button class="btn btn-primary" onclick="openModal()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="12" y1="5" x2="12" y2="19"></line>
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>
                Novo Post
            </button>
            <button class="btn btn-secondary" onclick="logout()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                    <polyline points="16 17 21 12 16 7"></polyline>
                    <line x1="21" y1="12" x2="9" y2="12"></line>
                </svg>
                Sair
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container">
        <!-- Empty State (mostrar quando não há posts) -->
        <div class="empty-state" id="emptyState">
            <p>Você ainda não tem nenhum post. Comece a escrever suas memórias!</p>
            <button class="btn btn-primary" onclick="openModal()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="12" y1="5" x2="12" y2="19"></line>
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>
                Criar Primeiro Post
            </button>
        </div>

        <!-- Timeline de Posts (inicialmente escondida) -->
        <div id="postsTimeline" style="display: none;">
            <!-- Exemplo de Post -->
            <article class="post">
                <div class="post-header">
                    <div>
                        <h2 class="post-title">teste</h2>
                        <p class="post-date">08 de novembro de 2025 às 10:22</p>
                    </div>
                    <div class="post-actions">
                        <button class="icon-btn" title="Editar">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                                <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
                            </svg>
                        </button>
                        <button class="icon-btn" title="Deletar">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <polyline points="3 6 5 6 21 6"></polyline>
                                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                            </svg>
                        </button>
                    </div>
                </div>
                <div class="post-content">
                    <p>teste</p>
                </div>
            </article>
        </div>
    </main>

    <!-- Modal Novo Post -->
    <div class="modal-overlay" id="modalOverlay" onclick="closeModalOnOverlay(event)">
        <div class="modal">
            <div class="modal-header">
                <h2 class="modal-title">Novo Post</h2>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>
            <form id="postForm" onsubmit="handleSubmit(event)">
                <div class="form-group">
                    <label for="postTitle">Título</label>
                    <input type="text" id="postTitle" placeholder="Dê um título ao seu post..." required>
                </div>
                <div class="form-group">
                    <label for="postContent">Conteúdo</label>
                    <textarea id="postContent" placeholder="Escreva suas memórias aqui..." required></textarea>
                </div>
                <div class="form-group">
                    <label for="postImage" class="image-input-label">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                            <circle cx="8.5" cy="8.5" r="1.5"></circle>
                            <polyline points="21 15 16 10 5 21"></polyline>
                        </svg>
                        Imagem (opcional)
                    </label>
                    <input type="url" id="postImage" placeholder="Cole a URL de uma imagem...">
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-cancel" onclick="closeModal()">Cancelar</button>
                    <button type="submit" class="btn btn-submit">Publicar Post</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Abrir Modal
        function openModal() {
            document.getElementById('modalOverlay').classList.add('active');
        }

        // Fechar Modal
        function closeModal() {
            document.getElementById('modalOverlay').classList.remove('active');
            document.getElementById('postForm').reset();
        }

        // Fechar modal ao clicar fora
        function closeModalOnOverlay(event) {
            if (event.target.id === 'modalOverlay') {
                closeModal();
            }
        }

        // Handle Submit
        function handleSubmit(event) {
            event.preventDefault();
            
            const title = document.getElementById('postTitle').value;
            const content = document.getElementById('postContent').value;
            const imageUrl = document.getElementById('postImage').value;
            
            // Aqui você adicionaria a lógica para salvar o post
            console.log('Novo post:', { title, content, imageUrl });
            
            // Esconder empty state e mostrar timeline
            document.getElementById('emptyState').style.display = 'none';
            document.getElementById('postsTimeline').style.display = 'block';
            
            closeModal();
            alert('Post publicado com sucesso!');
        }

        // Logout
        function logout() {
            if (confirm('Deseja realmente sair?')) {
                window.location.href = 'login.html';
            }
        }
    </script>
</body>
</html>
